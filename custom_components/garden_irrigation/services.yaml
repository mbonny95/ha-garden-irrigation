record_irrigation:
  fields:
    zone:
      required: true
      selector:
        device:
          integration: garden_irrigation
    source:
      required: true
      selector:
        select:
          translation_key: source
          options:
            - mains
            - tank
    minutes:
      required: false
      selector:
        number:
          min: 0.1
          max: 240
          step: 0.1
          mode: box
          unit_of_measurement: min
    mm:
      required: false
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: mm
    note:
      required: false
      selector:
        text:

set_deficit:
  fields:
    zone:
      required: true
      selector:
        device:
          integration: garden_irrigation
    deficit_mm:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          mode: box
          unit_of_measurement: mm
