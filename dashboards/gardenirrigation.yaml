# Garden Irrigation — example Lovelace dashboard (v2)
#
# Decision support only: nothing here operates a valve, pump or relay.
# Millimeters, minutes and liters are estimates of the FAO-56 water balance.
#
# Uses the custom cards in www/garden-irrigation-cards/ (see their README for
# the two resources to add). The cards find their entities by themselves:
# each zone card only needs the zone's device_id.
#
# Where to find a device_id: Settings → Devices & services → Garden
# Irrigation → open the zone device; the id is the last part of the page URL
# (/config/devices/device/<device_id>). Simpler: add the cards from the
# dashboard UI and pick the zone in the card editor.

title: Garden Irrigation
views:
  - title: Garden Irrigation
    path: garden-irrigation
    icon: mdi:sprinkler-variant
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:garden-irrigation-overview-card
            title: Giardino
          - type: markdown
            content: >
              **Supporto decisionale**: l'integrazione legge i sensori meteo,
              calcola il bilancio idrico FAO-56 e *consiglia*. Rubinetti e
              fonte (rete / cisterna) li gestisci tu. Millimetri, minuti e
              litri sono **stime**.

      - type: grid
        cards:
          - type: custom:garden-irrigation-zone-card
            device_id: REPLACE_WITH_ZONE_1_DEVICE_ID
            show_record_form: true

      - type: grid
        cards:
          - type: custom:garden-irrigation-zone-card
            device_id: REPLACE_WITH_ZONE_2_DEVICE_ID
            show_record_form: true

      # Starting deficit: run once per zone (0 = field capacity, e.g. the day
      # after a soaking rain). Replace the device ids as above.
      - type: grid
        cards:
          - type: heading
            heading: Deficit iniziale
            heading_style: subtitle
            icon: mdi:water-sync
          - type: button
            name: Zona 1 a capacità di campo
            icon: mdi:water-check
            tap_action:
              action: perform-action
              perform_action: garden_irrigation.set_deficit
              data:
                zone: REPLACE_WITH_ZONE_1_DEVICE_ID
                deficit_mm: 0
              confirmation:
                text: Impostare il deficit della zona 1 a 0 mm?
          - type: button
            name: Zona 2 a capacità di campo
            icon: mdi:water-check
            tap_action:
              action: perform-action
              perform_action: garden_irrigation.set_deficit
              data:
                zone: REPLACE_WITH_ZONE_2_DEVICE_ID
                deficit_mm: 0
              confirmation:
                text: Impostare il deficit della zona 2 a 0 mm?
